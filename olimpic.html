<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto #3 modal</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header class="barra">
        <span class="ubicacion">Ubicación: <strong id="ubicacionActual">sin elegir</strong></span>
        <button type="button" id="abrirModal" class="boton-secundario">Cambiar ciudad</button>
    </header>

    <div class="main" id="overlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tituloModal">

            <button type="button" class="cerrar" id="cerrarModal" aria-label="Cerrar">&times;</button>

            <h2 class="title" id="tituloModal">¿En qué ciudad estás?</h2>

            <div class="texto">
                <p>Recuerda que nuestros precios y coberturas de productos de supermercado varían
                    según tu ubicación.</p>
                <p>Para brindarte una mejor experiencia, selecciona tu departamento y ciudad.</p>
            </div>

            <form id="formUbicacion">
                <div class="cuadritos">
                    <label for="departamento">Departamento</label>
                    <select id="departamento" required>
                        <option value="">Selecciona un departamento</option>
                    </select>

                    <label for="ciudad">Ciudad</label>
                    <select id="ciudad" required disabled>
                        <option value="">Primero elige un departamento</option>
                    </select>
                </div>

                <div class="boton">
                    <button type="submit" class="subimbutton">ELEGIR</button>
                </div>
            </form>

        </div>
    </div>

    <script src="./script.js"></script>
</body>

</html>
